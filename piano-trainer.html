<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>やさしいピアノカフェ — ピアノパーソナルトレーナー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  /* ── カラー変数（ここを変えるだけで全体が変わります） ── */
  :root {
    --bg:      #FAFAF8;   /* ページ背景 */
    --bg2:     #F3F0ED;   /* セクション背景 */
    --main:    #C9A989;   /* メインカラー */
    --main-dk: #B89B7C;   /* ダーク */
    --accent:  #A08C6B;   /* アクセント */
    --accent-green: #A8C9A9; /* アクセント緑（新鮮感） */
    --text:    #3D3530;   /* 本文 */
    --sub:     #9B8B7E;   /* サブテキスト */
    --border:  #E5D9CE;   /* ボーダー */
    --card:    #FFFFFF;   /* カード背景 */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Noto Sans JP', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.75; font-size: 16px; }
  button { cursor: pointer; border: none; font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; }

  /* ── ナビ ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,241,237,0.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand { font-family: 'Noto Serif JP', serif; font-size: 0.88rem; color: var(--main); font-weight: 700; letter-spacing: 0.06em; }
  .nav-cta { background: var(--main); color: #fff; padding: 0.5rem 1.25rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; transition: background 0.2s; }
  .nav-cta:hover { background: var(--main-dk); }

  /* ── 共通 ── */
  section { padding: 4.5rem 1.5rem; }
  .container { max-width: 820px; margin: 0 auto; }
  .sec-label { font-size: 0.75rem; letter-spacing: 0.18em; color: var(--main); font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; }
  .sec-title { font-family: 'Noto Serif JP', serif; font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; line-height: 1.4; margin-bottom: 1rem; }
  .sec-sub { color: var(--sub); font-size: 0.95rem; margin-bottom: 2.5rem; line-height: 1.8; }

  /* ── Hero ── */
  .hero {
    min-height: 95vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 3rem 1.5rem;
    background:
      linear-gradient(155deg, rgba(245,241,237,0.92) 0%, rgba(237,230,222,0.88) 100%),
      url('IMG_2433.JPG') center/cover no-repeat;
    position: relative; overflow: hidden;
  }
  .hero::after { content: '♩'; position: absolute; bottom: 5%; right: 4%; font-size: 10rem; opacity: 0.04; color: var(--main); pointer-events: none; }

  .hero-limited {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--main); color: #fff;
    border-radius: 50px; padding: 0.35rem 1.1rem;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
    margin-bottom: 1.5rem;
  }
  .hero-limited-dot { width: 7px; height: 7px; background: var(--accent-green); border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .hero-title { font-family: 'Noto Serif JP', serif; font-size: clamp(1.9rem, 5.5vw, 3.2rem); font-weight: 700; line-height: 1.4; margin-bottom: 1.25rem; }
  .hero-title em { color: var(--main); font-style: normal; }
  .hero-sub { font-size: clamp(0.95rem, 2.5vw, 1.1rem); color: var(--sub); max-width: 560px; margin: 0 auto 0.75rem; line-height: 1.85; }
  .hero-name { font-size: 0.85rem; color: var(--accent); font-weight: 700; margin-bottom: 2rem; }

  .hero-cta-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  .line-btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: #06C755; color: #fff;
    padding: 0.75rem 2rem; border-radius: 50px;
    font-size: 0.9rem; font-weight: 700;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none;
  }
  .line-btn:hover { background: #05a848; transform: translateY(-2px); }
  .line-btn svg { width: 1.2em; height: 1.2em; fill: #fff; flex-shrink: 0; }
  .hero-cta {
    background: var(--main); color: #fff;
    padding: 1rem 2.5rem; border-radius: 50px;
    font-size: 1.05rem; font-weight: 700;
    box-shadow: 0 5px 20px rgba(200,119,58,0.35);
    transition: background 0.2s, transform 0.15s;
    display: inline-block;
  }
  .hero-cta:hover { background: var(--main-dk); transform: translateY(-2px); }
  .hero-cta-note { font-size: 0.78rem; color: var(--sub); }

  /* モニター帯 */
  .monitor-strip {
    background: var(--main); color: #fff;
    padding: 0.75rem 1.5rem; text-align: center;
    font-size: 0.88rem; font-weight: 700; letter-spacing: 0.03em;
  }
  .monitor-strip span { background: rgba(255,255,255,0.2); border-radius: 4px; padding: 0.1rem 0.5rem; margin-left: 0.5rem; font-size: 0.78rem; }

  /* ── こんな方へ（共感コピー） ── */
  .empathy-bg { background: var(--card); }
  .empathy-grid { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1.5rem; }
  .empathy-item {
    display: flex; align-items: flex-start; gap: 0.85rem;
    background: var(--bg); border-radius: 12px;
    padding: 1rem 1.25rem;
    border-left: 3px solid var(--main);
  }
  .empathy-icon { font-size: 1.3rem; flex-shrink: 0; }
  .empathy-text { font-size: 0.95rem; line-height: 1.65; }

  /* ── 3ヶ月プログラム（メイン） ── */
  .program-bg { background: var(--bg2); }
  .program-box {
    background: var(--card); border-radius: 20px;
    border: 2px solid var(--main);
    overflow: hidden;
    box-shadow: 0 6px 30px rgba(200,119,58,0.12);
  }
  .program-header { background: var(--main); color: #fff; padding: 1.5rem 2rem; }
  .program-header-label { font-size: 0.75rem; letter-spacing: 0.15em; opacity: 0.85; margin-bottom: 0.3rem; }
  .program-header-title { font-family: 'Noto Serif JP', serif; font-size: 1.35rem; font-weight: 700; }
  .program-header-sub { font-size: 0.85rem; opacity: 0.88; margin-top: 0.4rem; }
  .program-body { padding: 2rem; }
  .program-weeks { display: flex; flex-direction: column; gap: 1rem; }
  .week-item { display: flex; gap: 1rem; }
  .week-num { width: 3.5rem; height: 3.5rem; border-radius: 12px; background: var(--bg2); border: 1.5px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
  .week-num-label { font-size: 0.62rem; color: var(--sub); font-weight: 700; letter-spacing: 0.05em; }
  .week-num-num { font-family: 'Noto Serif JP', serif; font-size: 1.1rem; font-weight: 700; color: var(--main); }
  .week-body { flex: 1; }
  .week-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; }
  .week-desc { font-size: 0.85rem; color: var(--sub); line-height: 1.65; }
  .concert-box {
    margin-top: 1.5rem; background: var(--bg2); border-radius: 12px;
    padding: 1.25rem; border: 1px solid var(--border);
    display: flex; gap: 1rem; align-items: flex-start;
  }
  .concert-icon { font-size: 2rem; flex-shrink: 0; }
  .concert-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; color: var(--main); }
  .concert-desc { font-size: 0.82rem; color: var(--sub); line-height: 1.65; }
  .program-footer { background: var(--bg2); padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; border-top: 1px solid var(--border); }
  .program-price { font-family: 'Noto Serif JP', serif; font-size: 1.8rem; font-weight: 700; color: var(--main); }
  .program-price small { font-size: 0.9rem; font-family: 'Noto Sans JP', sans-serif; color: var(--sub); }
  .program-capacity { font-size: 0.82rem; color: var(--sub); font-weight: 700; }
  .program-cta { background: var(--main); color: #fff; padding: 0.7rem 1.75rem; border-radius: 50px; font-size: 0.9rem; font-weight: 700; transition: background 0.2s; }
  .program-cta:hover { background: var(--main-dk); }

  /* 通常プラン */
  .regular-card { background: var(--card); border-radius: 16px; padding: 1.5rem; border: 1px solid var(--border); margin-top: 1.5rem; }
  .regular-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.5rem; }
  .regular-price { font-size: 1.3rem; font-weight: 700; color: var(--main); margin-bottom: 0.5rem; }
  .regular-desc { font-size: 0.85rem; color: var(--sub); }

  /* ── なぜ違うのか ── */
  .diff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1.25rem; margin-top: 2rem; }
  .diff-card { background: var(--card); border-radius: 16px; padding: 1.5rem; border: 1px solid var(--border); }
  .diff-icon { font-size: 1.8rem; margin-bottom: 0.75rem; }
  .diff-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 0.4rem; }
  .diff-desc { font-size: 0.83rem; color: var(--sub); line-height: 1.7; }

  /* ── 受講の流れ ── */
  .steps { display: flex; flex-direction: column; gap: 0; margin-top: 2rem; }
  .step { display: flex; gap: 1.25rem; padding-bottom: 2rem; position: relative; }
  .step:not(:last-child)::after { content: ''; position: absolute; left: 1.15rem; top: 2.6rem; bottom: 0; width: 2px; background: var(--border); }
  .step-num { width: 2.4rem; height: 2.4rem; background: var(--main); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; transition: background 0.3s; }
  .step:hover .step-num { background: var(--accent-green); }
  .step-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.3rem; }
  .step-desc { font-size: 0.87rem; color: var(--sub); line-height: 1.7; }

  /* ── 実績 ── */
  .profile-bg { background: var(--card); }
  .profile-card { background: var(--bg); border-radius: 20px; padding: 2rem; border: 1px solid var(--border); }
  .profile-bg { background: linear-gradient(rgba(245,241,237,0.96),rgba(237,230,222,0.96)), url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1200&q=80') center/cover no-repeat; }
  .profile-stats { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .stat { text-align: center; }
  .stat-num { font-family: 'Noto Serif JP', serif; font-size: 2.2rem; font-weight: 700; color: var(--main); display: block; }
  .stat-label { font-size: 0.75rem; color: var(--sub); }
  .profile-text { font-size: 0.9rem; color: var(--sub); line-height: 1.85; margin-bottom: 1.25rem; }
  .profile-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .tag { background: var(--bg2); color: var(--main); border-radius: 50px; padding: 0.25rem 0.85rem; font-size: 0.78rem; font-weight: 700; border: 1px solid var(--border); }

  /* SNS機器について */
  .device-note { background: var(--bg2); border-radius: 12px; padding: 1.25rem; border: 1px solid var(--border); margin-top: 1.5rem; font-size: 0.87rem; color: var(--sub); line-height: 1.75; }
  .device-note strong { color: var(--text); }

  /* ── FAQ ── */
  .faq-list { margin-top: 2rem; display: flex; flex-direction: column; gap: 0.7rem; }
  .faq-item { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
  .faq-q { width: 100%; text-align: left; padding: 1.1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.9rem; background: none; color: var(--text); gap: 0.75rem; }
  .faq-q:hover { background: var(--bg); }
  .faq-arrow { color: var(--accent-green); flex-shrink: 0; transition: transform 0.2s; }
  .faq-arrow.open { transform: rotate(180deg); }
  .faq-item:hover { border-color: var(--accent-green); box-shadow: 0 2px 12px rgba(168, 201, 169, 0.15); }
  .faq-a { padding: 0 1.25rem 1rem; font-size: 0.87rem; color: var(--sub); line-height: 1.8; border-top: 1px solid var(--border); }

  /* ── CTA ── */
  .cta-section { background: linear-gradient(135deg, var(--main), var(--main-dk)); color: #fff; text-align: center; }
  .cta-title { font-family: 'Noto Serif JP', serif; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; margin-bottom: 0.75rem; }
  .cta-sub { font-size: 0.95rem; opacity: 0.9; margin-bottom: 2rem; line-height: 1.8; }
  .cta-btn { background: #fff; color: var(--main); padding: 1rem 2.75rem; border-radius: 50px; font-size: 1rem; font-weight: 700; display: inline-block; box-shadow: 0 4px 16px rgba(0,0,0,0.15); transition: transform 0.15s; }
  .cta-btn:hover { transform: translateY(-2px); }

  footer { background: var(--text); color: var(--border); text-align: center; padding: 1.75rem; font-size: 0.8rem; }
  footer a { color: var(--border); }

  @media (max-width: 600px) {
    .diff-grid { grid-template-columns: 1fr; }
    .profile-stats { gap: 1.5rem; }
    .program-footer { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const INTAKE = 'https://pianomami.github.io/piano-cafe-mami/intake-form.html';
const ZOOM_GUIDE = 'https://pianomami.github.io/piano-cafe-mami/zoom-guide.html';
const FLOW_GUIDE = 'https://pianomami.github.io/piano-cafe-mami/flow-guide.html';
const LINE_URL = 'https://lin.ee/YNL3n7c';

const FAQS = [
  { q: 'ピアノが全くゼロの状態でも参加できますか？', a: 'もちろんです。「手取り足取り、ゆっくり丁寧に」が まみの指導スタイルです。楽譜が読めなくても、鍵盤に触ったことがなくても、目標の曲に向けて着実に進めます。' },
  { q: '3ヶ月でどのくらい弾けるようになりますか？', a: '現在のレベルと目標曲によって変わります。だからこそ無料相談・体験レッスンで「この曲は弾けるか」を正直にお伝えします。無理な場合は正直に言い、現実的な代替プランを一緒に考えます。' },
  { q: 'ピアノ（電子ピアノ）はどんなものが必要ですか？', a: '61鍵以上のタッチ対応電子ピアノがあればOKです。お持ちでない方は体験後にご相談ください。ヘッドフォン対応なら夜間・早朝の練習もできます。' },
  { q: 'カメラはスマートフォンでもOKですか？', a: 'はい、スマートフォンやタブレットで大丈夫です。大切なのは「鍵盤が映ること」。鍵盤が見えることで指使い・手の形まで確認できるので、むしろ上達が早くなります。' },
  { q: 'ミニ発表会は絶対に参加しなくてはいけませんか？', a: '出席は完全に自由です。顔出しも不要で、「鍵盤だけ映す」スタイルでもOKです。発表会自体は他の受講生の演奏を聞くだけでも、大きな刺激と励みになります。' },
  { q: '練習はどれくらい必要ですか？', a: '1日15〜30分が理想です。「忙しい大人」が無理なく続けられる量を前提にプランを作ります。練習ができなかった週があっても大丈夫。その都度調整します。' },
  { q: '途中で目標の曲を変えたいときは？', a: '全力で相談に乗ります。ただし、途中変更は進捗に影響することもあるので、なぜ変えたいのかを一緒に考えた上で判断します。' },
  { q: '男性でも申し込めますか？', a: 'もちろんです。男性の受講者も歓迎します。「定年後の夢」「職場や家族をびっくりさせたい」という男性の方もいます。年齢・性別問わずお申し込みいただけます。' },
  { q: 'Zoomの使い方がわかりません', a: '画像つきのかんたんガイドをご用意しています。アプリの入れ方・つなぎ方・カメラの置き方まで丁寧に説明しています。ページ下部の「Zoomかんたんガイド」ボタンからご覧ください。また無料相談の時間にZoomの練習もできますので、安心してご連絡ください😊' },
  { q: 'レッスンの曜日・時間は固定ですか？', a: '平日の午前～昼過ぎが中心のレッスン時間帯になります。基本的に曜日と時間を固定してお届けしますが、スケジュール調整が必要な場合はご相談ください😊 お互いの予定が合えば振替も可能です。' },
  { q: '途中で続けられなくなった場合はどうなりますか？', a: 'やむを得ない事情がある場合はご相談ください。退会・返金に関する詳細は、ご入会後にお渡しする「入会のしおり」に記載しています。まずはお気軽にLINEでご連絡ください。' },
];

const STEPS = [
  { title: '① 無料相談（15分・無料）', desc: 'まずZoomで15分、気軽にお話しします。Zoomが初めての方の練習にもなります。弾きたい曲・不安なことを何でも聞いてください。申し込みの強制は一切ありません。' },
  { title: '② 体験レッスン（30分・1,000円）', desc: '実際にレッスンを体験していただきます。目標曲の難易度チェックと、3ヶ月で弾けるかを正直にお伝えします。当日PayPayまたは振込でのお支払い。' },
  { title: '③ 演奏動画を送る（任意）', desc: '弾いている様子の動画を送っていただくと、レベルや課題をより正確に把握できます。まったくゼロの方は「ドレミを弾いてみた」でもOK。動画が難しい場合はそのままレッスンスタートでも大丈夫です😊' },
  { title: '④ 12週間ロードマップの作成', desc: '目標曲から逆算して「何週目に何ができる状態か」を細かく設定した12週間プランを作成します。ゴールが見えているから、迷わず練習できます。' },
  { title: '⑤ レッスン＆全力サポートスタート', desc: 'レッスン＋練習状況の報告＋「毎日まみにLINE」サポートでお届けします。3ヶ月で弾ける！ミニ発表会もあります。' },
];

function FaqItem({ faq }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="faq-item">
      <button className="faq-q" onClick={() => setOpen(!open)}>
        <span>{faq.q}</span>
        <span className={`faq-arrow ${open ? 'open' : ''}`}>▼</span>
      </button>
      {open && <div className="faq-a">{faq.a}</div>}
    </div>
  );
}

function App() {
  return (
    <>
      {/* モニター帯 */}
      <div className="monitor-strip">
        🎹 現在モニター募集中！初月50%オフ <span>先着2名・限定募集</span>
      </div>

      {/* Nav */}
      <nav>
        <div className="nav-brand">やさしいピアノカフェ <span style={{fontSize:'0.75rem', opacity:0.7, fontWeight:400}}>by まみ</span></div>
        <a className="nav-cta" href={INTAKE}>まず無料相談する</a>
      </nav>

      {/* Hero */}
      <section className="hero">
        <div className="hero-limited">
          <span className="hero-limited-dot" />
          3ヶ月限定・5名まで
        </div>
        <p style={{fontSize:'0.8rem', color:'var(--sub)', letterSpacing:'0.12em', marginBottom:'0.5rem'}}>やさしいピアノカフェ</p>
        <h1 className="hero-title">
          弾きたい曲が、<em>弾ける。</em><br />
          ピアノパーソナルトレーナー
        </h1>
        <p className="hero-sub">
          娘の結婚式で弾きたい。定年後の夢をかなえたい。<br />
          イベントでサプライズしたい。<br />
          あなたの「弾きたい」に、まみが全力でお応えします。
        </p>
        <p className="hero-name">大手音楽教室 25年指導歴 ／ コンクール入賞者多数輩出</p>
        <div className="hero-cta-wrap">
